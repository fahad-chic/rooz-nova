  <style>
    *,*:before,*::after{box-sizing:border-box}
    html{background:#f7f1e6}
    body{margin:0;background:#f7f1e6;color:#181316;font-family:Tajawal,system-ui,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    #root{min-height:100vh;display:flex;align-items:center;justify-content:center}
    /* شاشة تحميل ناعمة: أيقونة حرف R والتاج في المنتصف */
    .rooz-boot{display:flex;flex-direction:column;align-items:center;gap:16px;opacity:0;animation:roozFadeIn .7s ease .05s forwards}
    .rooz-boot img{width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 8px 22px rgba(107,29,47,.22))}
    .rooz-boot .rooz-boot-bar{width:132px;height:3px;border-radius:999px;background:rgba(107,29,47,.14);overflow:hidden;position:relative}
    .rooz-boot .rooz-boot-bar::after{content:"";position:absolute;inset:0;width:40%;border-radius:999px;background:linear-gradient(90deg,#6b1d2f,#d4a5a5);animation:roozSlide 1.15s ease-in-out infinite}
    @keyframes roozFadeIn{to{opacity:1}}
    @keyframes roozSlide{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
    @media(prefers-reduced-motion:reduce){.rooz-boot{animation:none;opacity:1}.rooz-boot .rooz-boot-bar::after{animation:none;width:100%}}
  </style>
