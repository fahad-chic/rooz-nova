# =====================================================================
# المتغيّرات السرّية التالية أُزيلت من هذا الملف ويجب إضافتها يدوياً في
# Cloudflare Pages → Settings → Environment variables (Production):
#
#   VITE_FIREBASE_API_KEY        (مفتاح Firebase — إلزامي، بدونه لا يعمل الدخول)
#   VITE_OWNER_EMAILS            (بريد المالك/المشرف)
#   VITE_ADMIN_EMAILS            (بريد المشرف)
#   VITE_OWNER_SECRET_CODE       (الرمز السري لبوابة المالك المخفية)
#   VITE_PHONE_1, VITE_PHONE_2
#   VITE_CONTACT_WHATSAPP_1, VITE_CONTACT_WHATSAPP_2
#   VITE_ALIAA_CONTACTS
#   VITE_BANK_RAJHI_NAME, VITE_BANK_RAJHI_IBAN, VITE_BANK_RAJHI_ACCOUNT
#   VITE_BANK_ARABI_NAME, VITE_BANK_ARABI_IBAN, VITE_BANK_ARABI_ACCOUNT
#   VITE_CONTACT_EMAIL
#   GROQ_API_KEY                 (سري — لخدمة الذكاء الاصطناعي)
#   RESEND_API_KEY               (سري — لخدمة إرسال البريد/OTP)
# =====================================================================

